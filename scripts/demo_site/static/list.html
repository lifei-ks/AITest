<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>订单列表</title></head>
<body>
<h1>订单列表</h1>
<a href="/orders/create">新建订单</a>
<table border="1" id="orderTable">
  <thead><tr><th>订单号</th><th>收货人</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>
<div id="msg"></div>
<script>
var STATUS_MAP = { CREATED: '待支付', PAID: '已支付', SHIPPED: '已发货', COMPLETED: '已完成', CANCELLED: '已取消' }
// 初始 4 行，覆盖四个状态
var orders = [
  { orderNo: 'ORD1001', receiverName: '张三', amount: '100', status: 'CREATED' },
  { orderNo: 'ORD1002', receiverName: '李四', amount: '200', status: 'PAID' },
  { orderNo: 'ORD1003', receiverName: '王五', amount: '300', status: 'SHIPPED' },
  { orderNo: 'ORD1004', receiverName: '赵六', amount: '400', status: 'COMPLETED' }
]
function render() {
  var tbody = document.getElementById('tbody')
  tbody.innerHTML = ''
  orders.forEach(function (o, i) {
    var tr = document.createElement('tr')
    tr.innerHTML = '<td>' + o.orderNo + '</td><td>' + o.receiverName + '</td><td>' + o.amount + '</td><td>' + (STATUS_MAP[o.status] || o.status) + '</td>' +
      '<td>' +
      (o.status === 'CREATED' ? '<button data-act="pay" data-i="' + i + '">支付</button><button data-act="cancel" data-i="' + i + '">取消</button>' : '') +
      (o.status === 'PAID' ? '<button data-act="ship" data-i="' + i + '">发货</button>' : '') +
      (o.status === 'SHIPPED' ? '<button data-act="complete" data-i="' + i + '">完成</button>' : '') +
      '</td>'
    tbody.appendChild(tr)
  })
  document.querySelectorAll('[data-act]').forEach(function (b) {
    b.addEventListener('click', function () { doAction(b.dataset.act, parseInt(b.dataset.i)) })
  })
}
var ALLOW = { pay: ['CREATED', 'PAID'], ship: ['PAID', 'SHIPPED'], complete: ['SHIPPED', 'COMPLETED'], cancel: ['CREATED', 'CANCELLED'] }
var SUCCESS_MSG = { pay: '支付成功', ship: '发货成功', complete: '订单已完成', cancel: '订单已取消' }
function doAction(act, i) {
  var o = orders[i]
  if (o.status !== ALLOW[act][0]) {
    document.getElementById('msg').innerText = '当前状态不可' + act
    return
  }
  o.status = ALLOW[act][1]
  document.getElementById('msg').innerText = SUCCESS_MSG[act]
  render()
}
// 初始化：读 sessionStorage 的新订单，插入第一行；读创建标记显示成功提示
var newOrder = sessionStorage.getItem('newOrder')
if (newOrder) {
  orders.unshift(JSON.parse(newOrder))
  sessionStorage.removeItem('newOrder')
}
if (sessionStorage.getItem('justCreated') === '1') {
  document.getElementById('msg').innerText = '订单创建成功'
  sessionStorage.removeItem('justCreated')
}
render()
</script>
</body>
</html>
